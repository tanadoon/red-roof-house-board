    function getCurrentMonthStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function formatThaiMonth(ym) {
      const [y, m] = ym.split("-").map(Number);
      if (!y || !m) return ym;
      return `${THAI_MONTHS[m - 1]} ${y} (พ.ศ. ${y + 543})`;
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return "ไม่ระบุ";
      const parts = dateStr.split("-").map(Number);
      if (parts.length !== 3) return dateStr;
      const [, m, d] = parts;
      return `${d} ${THAI_SHORT_MONTHS[m - 1] || ""}`;
    }

    function shiftMonth(ym, delta) {
      const [y, m] = ym.split("-").map(Number);
      const date = new Date(y, m - 1 + delta, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function getDueStatus(targetDate, status) {
      if (!targetDate) return "none";
      if (status === "delivered") return "completed";
      const today = getTodayStr();
      if (targetDate < today) return "overdue";
      if (targetDate === today) return "due_today";
      return "upcoming";
    }

    function formatTHB(amount) {
      return Number(amount || 0).toLocaleString("th-TH");
    }

    function getRemainingBalance(task) {
      const price = Number(task.agreed_price) || 0;
      const status = task.payment_status || "unpaid_deposit";
      const deposit = Number(task.deposit_amount) || 0;
      if (status === "fully_paid") return 0;
      if (status === "deposit_paid") return Math.max(0, price - deposit);
      return price;
    }

        if (raw) {
          const cfg = JSON.parse(raw);
          if (cfg.url && cfg.anonKey) {
            return window.supabase.createClient(cfg.url, cfg.anonKey);
          }
        }
        return window.supabase.createClient(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_ANON_KEY);
      } catch {
        return null;
      }
    }

            .select("work_size, max_quota");
          if (!error && data && data.length > 0) {
            const merged = { ...getDefaultQuotas() };

              if (row.work_size in merged) {

            });
            setQuotas(merged);
            saveQuotas(merged);
            return;
          }

        setQuotas(loadQuotas());

          const { data, error } = await client
            .from("shipping_hops")
            .select("*")
            .order("hop_order", { ascending: true })
            .order("created_at", { ascending: true });
          if (!error && data) {
            setAllShippingHops(data);
            saveLocalShippingHops(data);
            return;

            .or(`month.eq.${monthToLoad},and(month.lt.${monthToLoad},status.neq.delivered)`)

            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "tasks" },
              () => {
                loadBoard(selectedMonth);
              }
            )
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "size_quotas" },
              () => {
                loadQuotasFromCloud();
              }
            )
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "shipping_hops" },
              () => {
                loadShippingHopsFromCloud();
              }
            )
            .subscribe();
        }

        const handleStorage = (e) => {
          if (e.key === LOCAL_TASKS_KEY) loadBoard(selectedMonth);
          if (e.key === LOCAL_QUOTAS_KEY) setQuotas(loadQuotas());
          if (e.key === LOCAL_HOPS_KEY) setAllShippingHops(loadLocalShippingHops());
        };
        const handleVisibility = () => {
          if (document.visibilityState === "visible") {
            loadBoard(selectedMonth);
            loadQuotasFromCloud();
            loadShippingHopsFromCloud();
          }
        };

        window.addEventListener("storage", handleStorage);
        document.addEventListener("visibilitychange", handleVisibility);

        return () => {
          if (client && channel) {
            client.removeChannel(channel);
          }
          window.removeEventListener("storage", handleStorage);
          document.removeEventListener("visibilitychange", handleVisibility);
        };
      }, [selectedMonth]);

      const handleQuotaChange = async (size, newLimit) => {
        const safeLimit = Math.max(0, Math.min(999, Number(newLimit) || 0));
        const updated = { ...quotas, [size]: safeLimit };
        setQuotas(updated);
        saveQuotas(updated);
        const client = getSupabaseClient();
        if (client) {
          await client
            .from("size_quotas")
            .upsert({ work_size: size, max_quota: safeLimit, updated_at: new Date().toISOString() }, { onConflict: "work_size" });
        }
      };

      const getTaskCustomerShippingCost = (taskId) =>
        allShippingHops
          .filter((h) => h.task_id === taskId)
          .reduce((sum, h) => sum + (Number(h.customer_cost) || 0), 0);

      const filteredTasks = useMemo(() => {
        return tasks.filter((task) => {
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = (task.title || "").toLowerCase().includes(q);
            const matchCustomer = (task.customer_name || "").toLowerCase().includes(q);
            const matchPhone = (task.customer_phone || "").toLowerCase().includes(q);
            const matchEmail = (task.customer_email || "").toLowerCase().includes(q);
            const matchAddress = (task.shipping_address || "").toLowerCase().includes(q);
            const matchDesc = (task.description || "").toLowerCase().includes(q);
            if (!matchTitle && !matchCustomer && !matchPhone && !matchEmail && !matchAddress && !matchDesc) return false;
          }
          if (priorityFilter !== "all" && task.priority !== priorityFilter) return false;
          if (sizeFilter !== "all" && (task.work_size || "A4") !== sizeFilter) return false;
          if (paymentFilter !== "all") {
            const workUnpaid = getRemainingBalance(task) > 0;
            const custShip = getTaskCustomerShippingCost(task.id);
            const shipUnpaid = custShip > 0 && !task.shipping_paid;
            const isAllPaid = !workUnpaid && !shipUnpaid;
            if (paymentFilter === "paid_all" && !isAllPaid) return false;
            if (paymentFilter === "unpaid_any" && isAllPaid) return false;
          }
          if (onlyOverdue) {
            const checkDate = task.delivery_date || task.due_date;
            if (getDueStatus(checkDate, task.status) !== "overdue") return false;
          }
          return true;
        });
      }, [tasks, allShippingHops, searchQuery, priorityFilter, sizeFilter, paymentFilter, onlyOverdue]);

      const stats = useMemo(() => {
        const total = tasks.length;
        const done = tasks.filter((t) => t.status === "delivered").length;
        const inProgress = tasks.filter((t) => t.status !== "delivered").length;
        const overdue = tasks.filter((t) => {
          const checkDate = t.delivery_date || t.due_date;
          return getDueStatus(checkDate, t.status) === "overdue";
        }).length;
        const percent = total === 0 ? 0 : Math.round((done / total) * 100);

        const totalRevenue = tasks.reduce((sum, t) => sum + (Number(t.agreed_price) || 0), 0);
        const totalRemainingWorkToCollect = tasks.reduce((sum, t) => sum + getRemainingBalance(t), 0);
        const totalCollected = Math.max(0, totalRevenue - totalRemainingWorkToCollect);
        const totalRemainingShippingToCollect = tasks.reduce((sum, t) => {
          if (t.shipping_paid) return sum;
          return sum + getTaskCustomerShippingCost(t.id);
        }, 0);
        const totalRemainingToCollect =
          totalRemainingWorkToCollect + totalRemainingShippingToCollect;
        const deliveredUnpaidCount = tasks.filter((t) => {
          if (t.status !== "delivered") return false;
          const workUnpaid = getRemainingBalance(t) > 0;
          const shipUnpaid = !t.shipping_paid && getTaskCustomerShippingCost(t.id) > 0;
          return workUnpaid || shipUnpaid;
        }).length;

        return {
          total,
          done,
          inProgress,
          overdue,
          percent,
          totalRevenue,
          totalCollected,
          totalRemainingWorkToCollect,
          totalRemainingShippingToCollect,
          totalRemainingToCollect,
          deliveredUnpaidCount,
        };
      }, [tasks, allShippingHops]);

      const quotaSummary = useMemo(() => {
        return DEFAULT_WORK_SIZES.map((size) => {
          const used = tasks.filter((t) => (t.work_size || "A4") === size).length;
          const limit = quotas[size] ?? 10;
          const remaining = Math.max(0, limit - used);
          const isFull = limit > 0 && used >= limit;
          const isNearFull = !isFull && limit > 0 && used / limit >= 0.8;
          const percent = limit === 0 ? 100 : Math.min(100, Math.round((used / limit) * 100));
          return { size, used, limit, remaining, isFull, isNearFull, percent };
        });
      }, [tasks, quotas]);

      const modalRemainingPreview = useMemo(() => {
        const price = Number(formAgreedPrice) || 0;
        const deposit = Number(formDepositAmount) || 0;
        if (formPaymentStatus === "fully_paid") return 0;
        if (formPaymentStatus === "deposit_paid") return Math.max(0, price - deposit);
        return price;
      }, [formAgreedPrice, formPaymentStatus, formDepositAmount]);

      const monthlyShippingStats = useMemo(() => {
        const monthHops = allShippingHops.filter(
          (h) => (h.shipped_at || "").startsWith(selectedMonth)
        );
        const shopTotal = monthHops.reduce((s, h) => s + (Number(h.shop_cost) || 0), 0);
        const customerTotal = monthHops.reduce((s, h) => s + (Number(h.customer_cost) || 0), 0);
        return {
          total: shopTotal + customerTotal,
          shopTotal,
          customerTotal,
          hopCount: monthHops.length,
        };
      }, [allShippingHops, selectedMonth]);

      const modalShippingTotals = useMemo(() => {
        const shopTotal = formHops.reduce((s, h) => s + (Number(h.shop_cost) || 0), 0);
        const customerTotal = formHops.reduce((s, h) => s + (Number(h.customer_cost) || 0), 0);
        return { shopTotal, customerTotal, total: shopTotal + customerTotal };
      }, [formHops]);

      const addEmptyHop = (carrier = "Flash", shippingType = "normal", routeNote = "") => {
        setFormHops((prev) => [
          ...prev,
          {
            hop_order: prev.length + 1,
            carrier,
            shipping_type: shippingType,
            route_note: routeNote,
            tracking_no: "",
            total_cost: "",
            shop_cost: "",
            customer_cost: "",
            shipped_at: getTodayStr(),
          },
        ]);
      };

      const applyShippingPreset = (presetType) => {
        const today = getTodayStr();
        if (presetType === "normal") {
          setFormHops([
            { hop_order: 1, carrier: "Flash", shipping_type: "normal", route_note: "ร้าน → ลูกค้า", tracking_no: "", total_cost: "", shop_cost: "", customer_cost: "", shipped_at: today },
          ]);
        } else if (presetType === "nca_grab") {
          setFormHops([
            { hop_order: 1, carrier: "นครชัยแอร์", shipping_type: "special", route_note: "ร้าน → กรุงเทพฯ", tracking_no: "", total_cost: "", shop_cost: "", customer_cost: "", shipped_at: today },
            { hop_order: 2, carrier: "Grab", shipping_type: "special", route_note: "กรุงเทพฯ → ลูกค้า", tracking_no: "", total_cost: "", shop_cost: "", customer_cost: "", shipped_at: today },
          ]);
        } else if (presetType === "inter") {
          setFormHops([
            { hop_order: 1, carrier: "นครชัยแอร์", shipping_type: "special", route_note: "ร้าน → กรุงเทพฯ", tracking_no: "", total_cost: "", shop_cost: "", customer_cost: "", shipped_at: today },
            { hop_order: 2, carrier: "Lalamove", shipping_type: "special", route_note: "กรุงเทพฯ → บ้านน้องดุล", tracking_no: "", total_cost: "", shop_cost: "", customer_cost: "", shipped_at: today },
            { hop_order: 3, carrier: "DHL", shipping_type: "special", route_note: "ไทย → ต่างประเทศ", tracking_no: "", total_cost: "", shop_cost: "", customer_cost: "", shipped_at: today },
          ]);
        }
      };

      const updateHopField = (idx, field, value) => {
        setFormHops((prev) =>
          prev.map((h, i) => {
            if (i !== idx) return h;
            if (field === "total_cost") {
              if (value === "") {
                return { ...h, total_cost: "", shop_cost: "", customer_cost: "" };
              }
              const total = Math.max(0, Number(value) || 0);
              const existingCust = Math.max(0, Number(h.customer_cost) || 0);
              if (existingCust > 0 && existingCust <= total) {
                return { ...h, total_cost: value, shop_cost: String(total - existingCust) };
              }
              return { ...h, total_cost: value, shop_cost: String(total), customer_cost: "0" };
            }
            if (field === "shop_cost") {
              const shop = Math.max(0, Number(value) || 0);
              const total = Math.max(0, Number(h.total_cost) || 0);
              if (total > 0) {
                if (shop > total) {
                  return { ...h, shop_cost: value, total_cost: String(shop), customer_cost: "0" };
                }
                return { ...h, shop_cost: value, customer_cost: String(total - shop) };
              }
              const cust = Math.max(0, Number(h.customer_cost) || 0);
              return { ...h, shop_cost: value, total_cost: String(shop + cust) };
            }
            if (field === "customer_cost") {
              const cust = Math.max(0, Number(value) || 0);
              const total = Math.max(0, Number(h.total_cost) || 0);
              if (total > 0) {
                if (cust > total) {
                  return { ...h, customer_cost: value, total_cost: String(cust), shop_cost: "0" };
                }
                return { ...h, customer_cost: value, shop_cost: String(total - cust) };
              }
              const shop = Math.max(0, Number(h.shop_cost) || 0);
              return { ...h, customer_cost: value, total_cost: String(shop + cust) };
            }
            return { ...h, [field]: value };
          })
        );
      };

      const removeHop = (idx) => {
        setFormHops((prev) => prev.filter((_, i) => i !== idx));
      };

      const openCreateModal = (defaultStatus = "todo") => {
        setEditingTask(null);
        setFormTitle("");
        setFormCustomerName("");
        setFormCustomerPhone("");
        setFormCustomerEmail("");
        setFormShippingAddress("");
        setFormDesc("");
        setFormStatus(defaultStatus);
        setFormPriority("medium");
        setFormWorkSize("A4");
        setFormAgreedPrice("");
        setFormPaymentStatus("unpaid_deposit");
        setFormDepositAmount("");
        setFormShippingPaid(false);
        setFormMonth(selectedMonth);
        setFormDueDate(`${selectedMonth}-20`);
        setFormDeliveryDate(`${selectedMonth}-25`);
        setFormHops([]);
        setIsTaskModalOpen(true);
      };

      const openEditModal = (task) => {
        setEditingTask(task);
        setFormTitle(task.title || "");
        setFormCustomerName(task.customer_name || "");
        setFormCustomerPhone(task.customer_phone || "");
        setFormCustomerEmail(task.customer_email || "");
        setFormShippingAddress(task.shipping_address || "");
        setFormDesc(task.description || "");
        setFormStatus(task.status || "todo");
        setFormPriority(task.priority || "medium");
        setFormWorkSize(task.work_size || "A4");
        setFormAgreedPrice(String(task.agreed_price ?? ""));
        setFormPaymentStatus(task.payment_status || "unpaid_deposit");
        setFormDepositAmount(String(task.deposit_amount ?? ""));
        setFormShippingPaid(Boolean(task.shipping_paid));
        setFormMonth(task.month || selectedMonth);
        setFormDueDate(task.due_date || "");
        setFormDeliveryDate(task.delivery_date || "");
        const existingHops = allShippingHops
          .filter((h) => h.task_id === task.id)
          .sort((a, b) => (a.hop_order || 0) - (b.hop_order || 0))
          .map((h) => ({
            ...h,
            total_cost: String((Number(h.shop_cost) || 0) + (Number(h.customer_cost) || 0)),
            shop_cost: String(h.shop_cost ?? 0),
            customer_cost: String(h.customer_cost ?? 0),
          }));
        setFormHops(existingHops);
        setIsTaskModalOpen(true);
      };

      const saveHopsForTask = async (taskId, hopsDraft) => {
        const client = getSupabaseClient();
        const normalized = hopsDraft.map((d, idx) => ({
          task_id: taskId,
          hop_order: idx + 1,
          carrier: d.carrier || "Flash",
          shipping_type: d.shipping_type || "normal",
          route_note: (d.route_note || "").trim(),
          tracking_no: (d.tracking_no || "").trim(),
          shop_cost: Math.max(0, Number(d.shop_cost) || 0),
          customer_cost: Math.max(0, Number(d.customer_cost) || 0),
          shipped_at: d.shipped_at || getTodayStr(),
        }));

        if (client) {
          await client.from("shipping_hops").delete().eq("task_id", taskId);
          if (normalized.length > 0) {
            await client.from("shipping_hops").insert(normalized);
          }
        }
        const others = loadLocalShippingHops().filter((h) => h.task_id !== taskId);
        const localCreated = normalized.map((n, idx) => ({
          ...n,
          id: `hop-${Date.now()}-${idx}`,
          created_at: new Date().toISOString(),
        }));
        saveLocalShippingHops([...others, ...localCreated]);
      };

      const handleSaveTask = async (e) => {
        e.preventDefault();
        if (!formTitle.trim() || !formCustomerPhone.trim()) return;
        const client = getSupabaseClient();

        const agreedPriceNum = Math.max(0, Number(formAgreedPrice) || 0);
        const depositNum =
          formPaymentStatus === "unpaid_deposit"
            ? 0
            : formPaymentStatus === "fully_paid"
            ? agreedPriceNum
            : Math.min(agreedPriceNum, Math.max(0, Number(formDepositAmount) || 0));

        let savedTaskId = editingTask ? editingTask.id : null;

        if (editingTask) {
          const updates = {
            title: formTitle.trim(),
            customer_name: formCustomerName.trim(),
            customer_phone: formCustomerPhone.trim(),
            customer_email: formCustomerEmail.trim(),
            shipping_address: formShippingAddress.trim(),
            description: formDesc.trim(),
            status: formStatus,
            priority: formPriority,
            work_size: formWorkSize,
            agreed_price: agreedPriceNum,
            payment_status: formPaymentStatus,
            deposit_amount: depositNum,
            shipping_paid: formShippingPaid,
            month: formMonth,
            due_date: formDueDate || null,
            delivery_date: formDeliveryDate || null,
            updated_at: new Date().toISOString(),
          };
          if (client) {
            await client.from("tasks").update(updates).eq("id", editingTask.id);
          }
          const all = loadLocalTasks().map((t) => (t.id === editingTask.id ? { ...t, ...updates } : t));
          saveLocalTasks(all);
        } else {
          const newTask = {
            id: crypto.randomUUID ? crypto.randomUUID() : `task-${Date.now()}`,
            title: formTitle.trim(),
            customer_name: formCustomerName.trim(),
            customer_phone: formCustomerPhone.trim(),
            customer_email: formCustomerEmail.trim(),
            shipping_address: formShippingAddress.trim(),
            description: formDesc.trim(),
            status: formStatus,
            priority: formPriority,
            work_size: formWorkSize,
            agreed_price: agreedPriceNum,
            payment_status: formPaymentStatus,
            deposit_amount: depositNum,
            shipping_paid: formShippingPaid,
            month: formMonth,
            due_date: formDueDate || null,
            delivery_date: formDeliveryDate || null,
            position: tasks.length,
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          };
          if (client) {
            const { id, ...payload } = newTask;
            const { data } = await client.from("tasks").insert([payload]).select().single();
            savedTaskId = data ? data.id : newTask.id;
          } else {
            savedTaskId = newTask.id;
          }
          const all = [...loadLocalTasks(), { ...newTask, id: savedTaskId }];
          saveLocalTasks(all);
        }

        if (savedTaskId) {
          await saveHopsForTask(savedTaskId, formHops);
        }

        setIsTaskModalOpen(false);
        await loadBoard(selectedMonth);
        await loadShippingHopsFromCloud();
      };

      const handleDeleteTask = async (id) => {
        const client = getSupabaseClient();
        if (client) {
          await client.from("tasks").delete().eq("id", id);
        }
        saveLocalTasks(loadLocalTasks().filter((t) => t.id !== id));
        setIsTaskModalOpen(false);
        await loadBoard(selectedMonth);
      };

      const commitStatusChange = async (
        taskId,
        newStatus,
        alsoMarkPaid = false,
        alsoMarkShippingPaid = false
      ) => {
        const target = tasks.find((t) => t.id === taskId);
        if (!target) return;

        const updatedMonth =
          newStatus === "delivered" && target.month < selectedMonth
            ? selectedMonth
            : target.month;

        const extraPayment = {
          ...(alsoMarkPaid
            ? { payment_status: "fully_paid", deposit_amount: Number(target.agreed_price) || 0 }
            : {}),
          ...(alsoMarkShippingPaid ? { shipping_paid: true } : {}),
        };

        setTasks((prev) =>
          prev.map((t) =>
            t.id === taskId ? { ...t, status: newStatus, month: updatedMonth, ...extraPayment } : t
          )
        );
        const client = getSupabaseClient();
        if (client) {
          await client
            .from("tasks")
            .update({ status: newStatus, month: updatedMonth, ...extraPayment })
            .eq("id", taskId);
        }
        const all = loadLocalTasks().map((t) =>
          t.id === taskId ? { ...t, status: newStatus, month: updatedMonth, ...extraPayment } : t
        );
        saveLocalTasks(all);
      };

      const handleStatusChange = async (taskId, newStatus) => {
        const target = tasks.find((t) => t.id === taskId);
        if (!target || target.status === newStatus) return;

        const hasUnpaidWork = getRemainingBalance(target) > 0;
        const custShipCost = getTaskCustomerShippingCost(target.id);
        const hasUnpaidShipping = custShipCost > 0 && !target.shipping_paid;

        if (newStatus === "delivered" && (hasUnpaidWork || hasUnpaidShipping)) {
          setPendingDeliveryTask(target);
          return;
        }

        await commitStatusChange(taskId, newStatus, false, false);
      };

      const handleMarkFullyPaid = async (task) => {
        const price = Number(task.agreed_price) || 0;
        setTasks((prev) =>
          prev.map((t) =>
            t.id === task.id ? { ...t, payment_status: "fully_paid", deposit_amount: price } : t
          )
        );
        const client = getSupabaseClient();
        if (client) {
          await client.from("tasks").update({ payment_status: "fully_paid", deposit_amount: price }).eq("id", task.id);
        }
        const all = loadLocalTasks().map((t) =>
          t.id === task.id ? { ...t, payment_status: "fully_paid", deposit_amount: price } : t
        );
        saveLocalTasks(all);
      };

      const handleToggleShippingPaid = async (task, paid) => {
        setTasks((prev) =>
          prev.map((t) =>
            t.id === task.id ? { ...t, shipping_paid: paid } : t
          )
        );
        const client = getSupabaseClient();
        if (client) {
          await client.from("tasks").update({ shipping_paid: paid }).eq("id", task.id);
        }
        const all = loadLocalTasks().map((t) =>
          t.id === task.id ? { ...t, shipping_paid: paid } : t
        );
        saveLocalTasks(all);
      };

      const handleMarkAllPaid = async (task) => {
        const price = Number(task.agreed_price) || 0;
        const updates = {
          payment_status: "fully_paid",
          deposit_amount: price,
          shipping_paid: true,
        };
        setTasks((prev) =>
          prev.map((t) => (t.id === task.id ? { ...t, ...updates } : t))
        );
        const client = getSupabaseClient();
        if (client) {
          await client.from("tasks").update(updates).eq("id", task.id);
        }
        const all = loadLocalTasks().map((t) =>
          t.id === task.id ? { ...t, ...updates } : t
        );
        saveLocalTasks(all);
      };

      const visibleColumns = useMemo(() => {
        if (mobileStageTab === "all") return COLUMNS;
        return COLUMNS.filter((c) => c.id === mobileStageTab);
      }, [mobileStageTab]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header (Warm White + Brand Palette #ca5151 / #77585e / #f9e1d3) */}
          <header className="sticky top-0 z-30 border-b-2 border-[#f9e1d3] bg-white/95 backdrop-blur-md shadow-sm">
            <div className="max-w-[1850px] mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <img
                  src="./logo-v2.jpg?v=2"
                  alt="Redroof House Logo"
                  className="h-12 sm:h-14 w-auto rounded-xl object-contain bg-white border border-[#f9e1d3] px-2 py-1 shadow-sm shrink-0"
                />
                <div>
                  <h1 className="text-base sm:text-lg font-bold text-[#77585e]">
                    Red Roof House Board
                  </h1>
                  <p className="text-[11px] sm:text-xs text-[#789ea5] font-medium">
                    ระบบแทรกกิ้งคิวงาน โควต้ารายเดือน มัดจำ และสถานะการจัดส่งลูกค้า
                  </p>
                </div>
              </div>

              {/* Month Selector */}
              <div className="flex items-center gap-1.5 bg-[#f9e1d3]/60 border border-[#cc8867]/30 rounded-xl p-1.5 w-full sm:w-auto justify-between sm:justify-start">
                <button
                  onClick={() => setSelectedMonth((m) => shiftMonth(m, -1))}
                  className="px-2.5 py-1 rounded-lg hover:bg-[#f9e1d3] text-[#77585e] font-bold"
                >
                  ◀
                </button>
                <span className="text-xs sm:text-sm font-bold text-[#77585e] text-center">
                  {formatThaiMonth(selectedMonth)}
                </span>
                <input
                  type="month"
                  value={selectedMonth}
                  onChange={(e) => e.target.value && setSelectedMonth(e.target.value)}
                  className="bg-white text-xs font-semibold text-[#77585e] rounded-lg px-2 py-1 border border-[#cc8867]/40 focus:outline-none focus:border-[#ca5151]"
                />
                <button
                  onClick={() => setSelectedMonth((m) => shiftMonth(m, 1))}
                  className="px-2.5 py-1 rounded-lg hover:bg-[#f9e1d3] text-[#77585e] font-bold"
                >
                  ▶
                </button>
              </div>

              {/* Action Button (No Cloud DB Settings Button) */}
              <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button
                  onClick={() => openCreateModal("todo")}
                  className="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-[#ca5151] hover:bg-[#b54242] text-white shadow-md shadow-[#ca5151]/25 transition"
                >
                  + เพิ่มงานใหม่
                </button>
              </div>
            </div>
          </header>

          {/* Dashboards & Filter Section */}
          <section className="max-w-[1850px] mx-auto w-full px-3 sm:px-6 py-4 space-y-4">
            {/* Work Size Quota Dashboard (8 Sizes) */}

                          min="0"
                          step="any"
                          disabled={formPaymentStatus !== "deposit_paid"}
                          value={
                            formPaymentStatus === "unpaid_deposit"
                              ? "0"
                              : formPaymentStatus === "fully_paid"
                              ? formAgreedPrice
                              : formDepositAmount
                          }
                          onChange={(e) => setFormDepositAmount(e.target.value)}
                          placeholder="0"
                          className="w-full bg-white border border-[#f9e1d3] disabled:opacity-50 rounded-xl px-3 py-2 text-sm text-[#4a3539]"
                        />
                      </div>
                    </div>

                    <div className="px-3 py-2 rounded-xl bg-white border border-[#d8b4fe] text-xs space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="text-[#77585e] font-semibold">ค่างานคงเหลือที่ต้องเก็บเพิ่ม:</span>
                        <span className={`font-bold ${modalRemainingPreview > 0 ? "text-[#ca5151]" : "text-[#789ea5]"}`}>
                          ฿{formatTHB(modalRemainingPreview)} บาท
                        </span>
                      </div>
                      {modalShippingTotals.customerTotal > 0 && (
                        <>
                          <div className="flex items-center justify-between text-[11px]">
                            <span className="text-[#5b3b8c] font-semibold">
                              ค่าส่งที่ลูกค้าออก ({formShippingPaid ? "เก็บแล้ว" : "ต้องเก็บเพิ่ม"}):
                            </span>
                            <span className={`font-bold ${formShippingPaid ? "text-[#4a6b72]" : "text-[#5b3b8c]"}`}>
                              ฿{formatTHB(modalShippingTotals.customerTotal)} บาท
                            </span>
                          </div>
                          <div className="flex items-center justify-between pt-1 border-t border-[#d8b4fe]/60">
                            <span className="text-[#77585e] font-bold">รวมยอดค้างเก็บทั้งหมด (ค่างาน + ค่าส่ง):</span>
                            <span className="text-sm font-bold text-[#ca5151]">
                              ฿{formatTHB(modalRemainingPreview + (formShippingPaid ? 0 : modalShippingTotals.customerTotal))} บาท
                            </span>
                          </div>
                        </>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-[#77585e] mb-1">ประจำเดือน</label>
                      <input
                        type="month"
                        value={formMonth}
                        onChange={(e) => setFormMonth(e.target.value)}
                        className="w-full bg-[#fdf7f2] border border-[#f9e1d3] rounded-xl px-3 py-2 text-sm text-[#4a3539]"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-[#77585e] mb-1">วันกำหนดทำเสร็จ</label>
                      <input
                        type="date"
                        value={formDueDate}
                        onChange={(e) => setFormDueDate(e.target.value)}
                        className="w-full bg-[#fdf7f2] border border-[#f9e1d3] rounded-xl px-3 py-2 text-sm text-[#4a3539]"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-[#ca5151] font-bold mb-1">วันที่ต้องส่งถึงมือลูกค้า</label>
                      <input
                        type="date"
                        value={formDeliveryDate}
                        onChange={(e) => setFormDeliveryDate(e.target.value)}
                        className="w-full bg-[#789ea5]/15 border border-[#789ea5] rounded-xl px-3 py-2 text-sm text-[#4a3539]"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-[#77585e] mb-1">รายละเอียดบรีฟเพิ่มเติม</label>
                    <textarea
                      rows="2"
                      value={formDesc}
                      onChange={(e) => setFormDesc(e.target.value)}
                      placeholder="จดบันทึกบรีฟลูกค้า สีกรอบ หรือข้อความการ์ด..."
                      className="w-full bg-[#fdf7f2] border border-[#f9e1d3] rounded-xl px-3.5 py-2 text-sm text-[#4a3539]"
                    />
                  </div>

                  {/* Multi-Hop Shipping Log Section */}
                  <div className="p-3.5 rounded-2xl bg-[#fdf7f2] border border-[#cc8867]/40 space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <span className="text-xs font-bold text-[#77585e]">
                          ประวัติการจัดส่ง & ค่าขนส่ง ({formHops.length} ขั้น)
                        </span>
                        <p className="text-[11px] text-[#77585e]/75">
                          บันทึกได้หลายต่อ (นับยอดรายเดือนตามวันที่ส่งจริงของแต่ละขั้น)
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={() => addEmptyHop("Flash", formHops.length > 0 ? "special" : "normal", "")}
                        className="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#789ea5] hover:bg-[#61838a] text-white transition"
                      >
                        + เพิ่มขั้นขนส่ง
                      </button>
                    </div>

                    {/* Quick Preset Templates */}
                    <div className="flex flex-wrap gap-1.5">
                      <span className="text-[10px] text-[#77585e]/70 self-center mr-1">เทมเพลตด่วน:</span>
                      <button
                        type="button"
                        onClick={() => applyShippingPreset("normal")}
                        className="text-[11px] px-2 py-0.5 rounded-md bg-white border border-[#f9e1d3] text-[#77585e] hover:border-[#ca5151]"
                      >
                        + ปกติ (Flash)
                      </button>
                      <button
                        type="button"
                        onClick={() => applyShippingPreset("nca_grab")}
                        className="text-[11px] px-2 py-0.5 rounded-md bg-white border border-[#f9e1d3] text-[#77585e] hover:border-[#ca5151]"
                      >
                        + นครชัยแอร์ → Grab
                      </button>
                      <button
                        type="button"
                        onClick={() => applyShippingPreset("inter")}
                        className="text-[11px] px-2 py-0.5 rounded-md bg-white border border-[#f9e1d3] text-[#77585e] hover:border-[#ca5151]"
                      >
                        + ตปท. (NCA → Lalamove → DHL)
                      </button>
                    </div>

                    {formHops.length === 0 ? (
                      <div className="text-center py-3 text-xs text-[#77585e]/60 bg-white/70 rounded-xl border border-dashed border-[#cc8867]/30">
                        ยังไม่มีบันทึกการจัดส่ง กด "+ เพิ่มขั้นขนส่ง" หรือเลือกเทมเพลตด้านบน
                      </div>
                    ) : (
                      <div className="space-y-2.5">
                        {formHops.map((hop, idx) => (
                          <div key={idx} className="p-2.5 rounded-xl bg-white border border-[#f9e1d3] space-y-2">
                            <div className="flex items-center justify-between gap-2">
                              <span className="text-xs font-bold text-[#ca5151]">
                                ขั้นที่ {idx + 1} (Hop {idx + 1})
                              </span>
                              <button
                                type="button"
                                onClick={() => removeHop(idx)}
                                className="text-[11px] text-[#ca5151] hover:underline font-semibold"
                              >
                                ลบขั้นนี้
                              </button>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                              <div>
                                <label className="block text-[10px] font-semibold text-[#77585e] mb-0.5">ขนส่ง</label>
                                <select
                                  value={hop.carrier}
                                  onChange={(e) => updateHopField(idx, "carrier", e.target.value)}
                                  className="w-full bg-[#fdf7f2] border border-[#f9e1d3] rounded-lg px-2 py-1.5 text-xs font-semibold text-[#4a3539]"
                                >
                                  {SHIPPING_CARRIERS.map((c) => (
                                    <option key={c} value={c}>{c}</option>
                                  ))}
                                </select>
                              </div>

                              <div>
                                <label className="block text-[10px] font-semibold text-[#77585e] mb-0.5">ประเภทการส่ง</label>
                                <select
                                  value={hop.shipping_type}
                                  onChange={(e) => updateHopField(idx, "shipping_type", e.target.value)}
                                  className="w-full bg-[#fdf7f2] border border-[#f9e1d3] rounded-lg px-2 py-1.5 text-xs font-semibold text-[#4a3539]"
                                >
                                  <option value="normal">ปกติ</option>
                                  <option value="special">ด่วน / พิเศษ</option>
                                </select>
                              </div>

                              <div>
                                <label className="block text-[10px] font-semibold text-[#77585e] mb-0.5">วันที่ส่งจริง</label>
                                <input
                                  type="date"
                                  value={hop.shipped_at || ""}
                                  onChange={(e) => updateHopField(idx, "shipped_at", e.target.value)}
                                  className="w-full bg-[#fdf7f2] border border-[#f9e1d3] rounded-lg px-2 py-1.5 text-xs text-[#4a3539]"
                                />
                              </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                              <div>
                                <label className="block text-[10px] font-semibold text-[#77585e] mb-0.5">เส้นทาง / หมายเหตุ</label>
                                <input
                                  type="text"
                                  value={hop.route_note || ""}
                                  onChange={(e) => updateHopField(idx, "route_note", e.target.value)}
                                  placeholder="เช่น ร้าน → กทม. หรือ ส่งไปสิงคโปร์"
                                  className="w-full bg-[#fdf7f2] border border-[#f9e1d3] rounded-lg px-2.5 py-1.5 text-xs text-[#4a3539]"
                                />
                              </div>
                              <div>
                                <label className="block text-[10px] font-semibold text-[#77585e] mb-0.5">เลขพัสดุ (Tracking)</label>
                                <input
                                  type="text"
                                  value={hop.tracking_no || ""}
                                  onChange={(e) => updateHopField(idx, "tracking_no", e.target.value)}
                                  placeholder="เลขพัสดุ / ลิงก์ Grab (ถ้ามี)"
                                  className="w-full bg-[#fdf7f2] border border-[#f9e1d3] rounded-lg px-2.5 py-1.5 text-xs text-[#4a3539]"
                                />
                              </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                              <div>
                                <label className="block text-[10px] font-bold text-[#ca5151] mb-0.5">ค่าส่งทั้งหมด (บาท)</label>
                                <input
                                  type="number"
                                  min="0"
                                  step="any"
                                  value={hop.total_cost ?? ""}
                                  onChange={(e) => updateHopField(idx, "total_cost", e.target.value)}
                                  placeholder="0"
                                  className="w-full bg-[#ffc0b8]/25 border border-[#ca5151]/50 rounded-lg px-2.5 py-1.5 text-xs font-bold text-[#4a3539]"
                                />
                              </div>
                              <div>
                                <label className="block text-[10px] font-semibold text-[#77585e] mb-0.5">ร้านออก (บาท)</label>
                                <input
                                  type="number"
                                  min="0"
                                  step="any"
                                  value={hop.shop_cost}
                                  onChange={(e) => updateHopField(idx, "shop_cost", e.target.value)}
                                  placeholder="0"
                                  className="w-full bg-[#f9e1d3]/35 border border-[#cc8867]/40 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-[#4a3539]"
                                />
                              </div>
                              <div>
                                <label className="block text-[10px] font-semibold text-[#5b3b8c] mb-0.5">ลูกค้าออก (บาท)</label>
                                <input
                                  type="number"
                                  min="0"
                                  step="any"
                                  value={hop.customer_cost}
                                  onChange={(e) => updateHopField(idx, "customer_cost", e.target.value)}
                                  placeholder="0"
                                  className="w-full bg-[#f3e8ff]/60 border border-[#d8b4fe] rounded-lg px-2.5 py-1.5 text-xs font-semibold text-[#4a3539]"
                                />
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {formHops.length > 0 && (
                      <div className="space-y-2">
                        <div className="flex flex-wrap items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white border border-[#cc8867]/40 text-xs">
                          <span className="font-bold text-[#77585e]">
                            ค่าส่งรวมชิ้นนี้: ฿{formatTHB(modalShippingTotals.total)}
                          </span>
                          <span className="text-[11px] text-[#77585e]/85">
                            ร้านออก ฿{formatTHB(modalShippingTotals.shopTotal)} • ลูกค้าออก ฿{formatTHB(modalShippingTotals.customerTotal)}
                          </span>
                        </div>
                        {modalShippingTotals.customerTotal > 0 && (
                          <label className="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-[#f3e8ff]/70 border border-[#d8b4fe] cursor-pointer text-xs">
                            <div className="flex items-center gap-2">
                              <input
                                type="checkbox"
                                checked={formShippingPaid}
                                onChange={(e) => setFormShippingPaid(e.target.checked)}
                                className="w-4 h-4 accent-[#5b3b8c] rounded"
                              />
                              <span className="font-bold text-[#5b3b8c]">
                                เก็บค่าส่งส่วนที่ลูกค้าออกแล้ว (฿{formatTHB(modalShippingTotals.customerTotal)})
                              </span>
                            </div>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-white text-[#5b3b8c] border border-[#d8b4fe]">
                              TAG: คิดค่าส่ง
                            </span>
                          </label>
                        )}
                      </div>
                    )}
                  </div>

                  <div className="flex items-center justify-between pt-3 border-t border-[#f9e1d3]">
                    {editingTask ? (
                      <button
                        type="button"
                        onClick={() => handleDeleteTask(editingTask.id)}
                        className="text-xs text-[#ca5151] font-bold hover:underline"
                      >
                        ลบงานนี้
                      </button>
                    ) : <div />}
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsTaskModalOpen(false)}
                        className="px-4 py-2 rounded-xl text-xs font-semibold bg-[#f9e1d3] text-[#77585e]"
                      >
                        ยกเลิก
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2 rounded-xl text-xs font-bold bg-[#ca5151] hover:bg-[#b03e3e] text-white shadow-md shadow-[#ca5151]/25"
                      >
                        บันทึกงาน
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
