  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const LOCAL_TASKS_KEY = "red_roof_house_tasks_v3";
    const LOCAL_QUOTAS_KEY = "red_roof_house_quotas_v1";
    const LOCAL_SUPABASE_CONFIG_KEY = "kanban_supabase_config_v1";

    const DEFAULT_WORK_SIZES = ["A2", "A3", "A4", "A5"];

    const COLUMNS = [
      { id: "todo", title: "To Do", accent: "border-t-[#7b1e34]", headerBg: "bg-[#7b1e34]/10", badgeBg: "bg-[#7b1e34] text-pink-50 border border-[#611527]" },
      { id: "draft", title: "วาดดราฟ", accent: "border-t-purple-400", headerBg: "bg-purple-100/75", badgeBg: "bg-purple-200/90 text-purple-900 border border-purple-300" },
      { id: "cutting", title: "ตัดกระดาษ", accent: "border-t-sky-400", headerBg: "bg-sky-100/80", badgeBg: "bg-sky-200/90 text-sky-900 border border-sky-300" },
      { id: "framing", title: "ทำกรอบ", accent: "border-t-pink-400", headerBg: "bg-pink-100/75", badgeBg: "bg-pink-200/90 text-pink-900 border border-pink-300" },
      { id: "backdrop", title: "ทำแบคดรอป", accent: "border-t-violet-400", headerBg: "bg-violet-100/75", badgeBg: "bg-violet-200/90 text-violet-900 border border-violet-300" },
      { id: "ready_to_ship", title: "รอส่ง", accent: "border-t-[#9e2a45]", headerBg: "bg-rose-100/80", badgeBg: "bg-[#8c223b] text-white border border-[#70192d]" },
      { id: "delivered", title: "ส่งแล้ว", accent: "border-t-sky-500", headerBg: "bg-gradient-to-r from-sky-100/80 to-emerald-100/70", badgeBg: "bg-emerald-100 text-emerald-800 border border-emerald-300" },
    ];

    const PRIORITY_STYLES = {
      high: { label: "High", badge: "bg-[#7b1e34]/15 text-[#7b1e34] border-[#7b1e34]/30 font-semibold", dot: "bg-[#7b1e34]" },
      medium: { label: "Medium", badge: "bg-purple-100 text-purple-800 border-purple-300", dot: "bg-purple-500" },
      low: { label: "Low", badge: "bg-sky-100 text-sky-800 border-sky-300", dot: "bg-sky-500" },
    };

    const SIZE_BADGE_STYLES = {
      A2: "bg-[#7b1e34] text-pink-50 border-[#5e1426]",
      A3: "bg-sky-100 text-sky-900 border-sky-300",
      A4: "bg-pink-100 text-[#7b1e34] border-pink-300",
      A5: "bg-purple-100 text-purple-900 border-purple-300",
    };

    const THAI_MONTHS = [
      "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
      "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
    ];

    function getCurrentMonthStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function formatThaiMonth(ym) {
      const [y, m] = ym.split("-").map(Number);
      if (!y || !m) return ym;
      return `${THAI_MONTHS[m - 1]} ${y} (พ.ศ. ${y + 543})`;
    }

    function shiftMonth(ym, delta) {
      const [y, m] = ym.split("-").map(Number);
      const date = new Date(y, m - 1 + delta, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function getDueStatus(targetDate, status) {
      if (!targetDate) return "none";
      if (status === "delivered") return "completed";
      const today = getTodayStr();
      if (targetDate < today) return "overdue";
      if (targetDate === today) return "due_today";
      return "upcoming";
    }

    function formatTHB(amount) {
      return Number(amount || 0).toLocaleString("th-TH");
    }

    function getRemainingBalance(task) {
      const price = Number(task.agreed_price) || 0;
      const status = task.payment_status || "unpaid_deposit";
      const deposit = Number(task.deposit_amount) || 0;
      if (status === "fully_paid") return 0;
      if (status === "deposit_paid") return Math.max(0, price - deposit);
      return price;
    }

    function getDefaultQuotas() {
      return { A2: 10, A3: 10, A4: 10, A5: 10 };
    }

    function loadQuotas() {
      try {
        const raw = localStorage.getItem(LOCAL_QUOTAS_KEY);
        if (!raw) {
          const defaults = getDefaultQuotas();
          localStorage.setItem(LOCAL_QUOTAS_KEY, JSON.stringify(defaults));
          return defaults;
        }
        return { ...getDefaultQuotas(), ...JSON.parse(raw) };
      } catch {
        return getDefaultQuotas();
      }
    }

    function saveQuotas(quotas) {
      localStorage.setItem(LOCAL_QUOTAS_KEY, JSON.stringify(quotas));
    }

    function getDefaultSampleTasks() {
      const ym = getCurrentMonthStr();
      const nowIso = new Date().toISOString();
      return [
        {
          id: "sample-0",
          title: "ฉากร้านดอกไม้ของขวัญวันครบรอบ",
          customer_name: "คุณแพรว (Line: praew_p)",

          status: "todo",

          work_size: "A4",
          agreed_price: 2500,
          payment_status: "unpaid_deposit",

        {

          description: "โทนสีพาสเทล เพิ่มน้องหมาคอร์กี้ด้านหน้า 2 ตัว",

        {
          id: "sample-2",

          customer_name: "คุณนนท์ (Line: non_k)",
          description: "เน้นรายละเอียดสวนหน้าบ้านและป้ายชื่อบ้าน",
          status: "cutting",
          priority: "high",
          work_size: "A2",
          agreed_price: 5200,
          payment_status: "deposit_paid",

          month: ym,
          due_date: `${ym}-15`,
          delivery_date: `${ym}-19`,
          position: 2,
          created_at: nowIso,
          updated_at: nowIso,
        },
        {
          id: "sample-3",
          title: "งานวันเกิดธีมคาเฟ่ญี่ปุ่น",
          customer_name: "คุณมายด์",
          description: "กรอบไม้สีอ่อน ติดไฟแฟรี่ไลท์ด้านใน",
          status: "framing",
          priority: "medium",
          work_size: "A4",
          agreed_price: 2600,
          payment_status: "deposit_paid",
          deposit_amount: 1300,
          month: ym,
          due_date: `${ym}-14`,
          delivery_date: `${ym}-16`,
          position: 3,
          created_at: nowIso,
          updated_at: nowIso,
        },
        {
          id: "sample-4",
          title: "ของขวัญรับปริญญา มศว",
          customer_name: "คุณเจมส์",
          description: "ฉากหลังตึกคณะ พร้อมช่อดอกไม้จิ๋ว",
          status: "backdrop",
          priority: "medium",
          work_size: "A4",
          agreed_price: 2400,
          payment_status: "deposit_paid",
          deposit_amount: 1000,
          month: ym,
          due_date: `${ym}-21`,
          delivery_date: `${ym}-25`,
          position: 4,
          created_at: nowIso,
          updated_at: nowIso,
        },
        {
          id: "sample-5",
          title: "มินิการ์ดครบรอบแต่งงาน",
          customer_name: "คุณแอน",
          description: "แพ็คกล่องของขวัญผูกโบว์สีแดง พร้อมการ์ดอวยพร",
          status: "ready_to_ship",
          priority: "low",
          work_size: "A5",
          agreed_price: 1500,
          payment_status: "deposit_paid",
          deposit_amount: 750,
          month: ym,
          due_date: `${ym}-16`,
          delivery_date: `${ym}-18`,
          position: 5,
          created_at: nowIso,
          updated_at: nowIso,
        },
        {
          id: "sample-6",
          title: "ฉากครอบครัว 5 คน ทริปภูเขา",
          customer_name: "คุณกิตติ",
          description: "ส่ง EMS แล้ว แจ้งเลขพัสดุเรียบร้อย",
          status: "delivered",
          priority: "medium",
          work_size: "A3",
          agreed_price: 3900,
          payment_status: "fully_paid",
          deposit_amount: 3900,
          month: ym,
          due_date: `${ym}-08`,
          delivery_date: `${ym}-10`,
          position: 6,
          created_at: nowIso,
          updated_at: nowIso,
        },
      ];
    }

    function getSupabaseClient() {
      try {
        const raw = localStorage.getItem(LOCAL_SUPABASE_CONFIG_KEY);
        if (!raw) return null;
        const cfg = JSON.parse(raw);
        if (!cfg.url || !cfg.anonKey) return null;
        return window.supabase.createClient(cfg.url, cfg.anonKey);
      } catch {
        return null;
      }
    }

    function loadLocalTasks() {
      try {
        const raw = localStorage.getItem(LOCAL_TASKS_KEY);
        if (!raw) {
          const defaults = getDefaultSampleTasks();
          localStorage.setItem(LOCAL_TASKS_KEY, JSON.stringify(defaults));
          return defaults;
        }
        return JSON.parse(raw);
      } catch {
        return getDefaultSampleTasks();
      }
    }

    function saveLocalTasks(tasks) {
      localStorage.setItem(LOCAL_TASKS_KEY, JSON.stringify(tasks));
    }

    function filterTasksWithCarryOver(allTasks, monthToLoad) {
      return allTasks.filter(
        (t) =>
          t.month === monthToLoad ||
          (t.month < monthToLoad && t.status !== "delivered")
      );
    }

    function App() {
      const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
      const [tasks, setTasks] = useState([]);
      const [quotas, setQuotas] = useState(getDefaultQuotas());
      const [isEditingQuotas, setIsEditingQuotas] = useState(false);
      const [storageMode, setStorageMode] = useState("local");

      // Mobile / iPad stage tab ("all" or specific stage)
      const [mobileStageTab, setMobileStageTab] = useState("all");

      // Filters
      const [searchQuery, setSearchQuery] = useState("");
      const [priorityFilter, setPriorityFilter] = useState("all");
      const [sizeFilter, setSizeFilter] = useState("all");
      const [onlyOverdue, setOnlyOverdue] = useState(false);

      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const [dragOverColumn, setDragOverColumn] = useState(null);

      // Modal states
      const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [formTitle, setFormTitle] = useState("");
      const [formCustomerName, setFormCustomerName] = useState("");
      const [formDesc, setFormDesc] = useState("");
      const [formStatus, setFormStatus] = useState("todo");
      const [formPriority, setFormPriority] = useState("medium");
      const [formWorkSize, setFormWorkSize] = useState("A4");
      const [formAgreedPrice, setFormAgreedPrice] = useState("");
      const [formPaymentStatus, setFormPaymentStatus] = useState("unpaid_deposit");
      const [formDepositAmount, setFormDepositAmount] = useState("");
      const [formMonth, setFormMonth] = useState(selectedMonth);
      const [formDueDate, setFormDueDate] = useState("");
      const [formDeliveryDate, setFormDeliveryDate] = useState("");

      const [isCloudModalOpen, setIsCloudModalOpen] = useState(false);
      const [supabaseUrl, setSupabaseUrl] = useState("");
      const [supabaseKey, setSupabaseKey] = useState("");
      const [syncMessage, setSyncMessage] = useState(null);

      const loadBoard = async (monthToLoad = selectedMonth) => {
        const client = getSupabaseClient();
        if (client) {
          const { data, error } = await client
            .from("tasks")
            .select("*")
            .or(`month.eq.${monthToLoad},and(month.lt.${monthToLoad},status.neq.delivered)`)
            .order("position", { ascending: true });
          if (!error && data) {
            setTasks(data);
            setStorageMode("supabase");
            return;
          }
        }
        setStorageMode("local");
        setTasks(filterTasksWithCarryOver(loadLocalTasks(), monthToLoad));
      };

      useEffect(() => {
        setQuotas(loadQuotas());
      }, []);

      useEffect(() => {
        loadBoard(selectedMonth);
        try {
          const raw = localStorage.getItem(LOCAL_SUPABASE_CONFIG_KEY);
          if (raw) {
            const cfg = JSON.parse(raw);
            setSupabaseUrl(cfg.url || "");
            setSupabaseKey(cfg.anonKey || "");
          }
        } catch {}
      }, [selectedMonth]);

      const handleQuotaChange = (size, newLimit) => {
        const safeLimit = Math.max(0, Math.min(999, Number(newLimit) || 0));
        const updated = { ...quotas, [size]: safeLimit };
        setQuotas(updated);
        saveQuotas(updated);
      };

      const filteredTasks = useMemo(() => {
        return tasks.filter((task) => {
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = (task.title || "").toLowerCase().includes(q);
            const matchCustomer = (task.customer_name || "").toLowerCase().includes(q);
            const matchDesc = (task.description || "").toLowerCase().includes(q);
            if (!matchTitle && !matchCustomer && !matchDesc) return false;
          }
          if (priorityFilter !== "all" && task.priority !== priorityFilter) return false;
          if (sizeFilter !== "all" && (task.work_size || "A4") !== sizeFilter) return false;
          if (onlyOverdue) {
            const checkDate = task.delivery_date || task.due_date;
            if (getDueStatus(checkDate, task.status) !== "overdue") return false;
          }
          return true;
        });
      }, [tasks, searchQuery, priorityFilter, sizeFilter, onlyOverdue]);

      const stats = useMemo(() => {
        const total = tasks.length;
        const done = tasks.filter((t) => t.status === "delivered").length;
        const inProgress = tasks.filter((t) => t.status !== "delivered").length;
        const overdue = tasks.filter((t) => {
          const checkDate = t.delivery_date || t.due_date;
          return getDueStatus(checkDate, t.status) === "overdue";
        }).length;
        const percent = total === 0 ? 0 : Math.round((done / total) * 100);

        const totalRevenue = tasks.reduce((sum, t) => sum + (Number(t.agreed_price) || 0), 0);
        const totalRemainingToCollect = tasks.reduce((sum, t) => sum + getRemainingBalance(t), 0);
        const totalCollected = Math.max(0, totalRevenue - totalRemainingToCollect);

        return { total, done, inProgress, overdue, percent, totalRevenue, totalCollected, totalRemainingToCollect };
      }, [tasks]);

      const quotaSummary = useMemo(() => {
        return DEFAULT_WORK_SIZES.map((size) => {
          const used = tasks.filter((t) => (t.work_size || "A4") === size).length;
          const limit = quotas[size] ?? 10;
          const remaining = Math.max(0, limit - used);
          const isFull = limit > 0 && used >= limit;
          const isNearFull = !isFull && limit > 0 && used / limit >= 0.8;
          const percent = limit === 0 ? 100 : Math.min(100, Math.round((used / limit) * 100));
          return { size, used, limit, remaining, isFull, isNearFull, percent };
        });
      }, [tasks, quotas]);

      const modalRemainingPreview = useMemo(() => {
        const price = Number(formAgreedPrice) || 0;
        const deposit = Number(formDepositAmount) || 0;
        if (formPaymentStatus === "fully_paid") return 0;
        if (formPaymentStatus === "deposit_paid") return Math.max(0, price - deposit);
        return price;
      }, [formAgreedPrice, formPaymentStatus, formDepositAmount]);

      const openCreateModal = (defaultStatus = "todo") => {
        setEditingTask(null);
        setFormTitle("");
        setFormCustomerName("");
        setFormDesc("");
        setFormStatus(defaultStatus);
        setFormPriority("medium");
        setFormWorkSize("A4");
        setFormAgreedPrice("");
        setFormPaymentStatus("unpaid_deposit");
        setFormDepositAmount("");
        setFormMonth(selectedMonth);
        setFormDueDate(`${selectedMonth}-20`);
        setFormDeliveryDate(`${selectedMonth}-25`);
        setIsTaskModalOpen(true);
      };

      const openEditModal = (task) => {
        setEditingTask(task);
        setFormTitle(task.title || "");
        setFormCustomerName(task.customer_name || "");
        setFormDesc(task.description || "");
        setFormStatus(task.status || "todo");
        setFormPriority(task.priority || "medium");
        setFormWorkSize(task.work_size || "A4");
        setFormAgreedPrice(String(task.agreed_price ?? ""));
        setFormPaymentStatus(task.payment_status || "unpaid_deposit");
        setFormDepositAmount(String(task.deposit_amount ?? ""));
        setFormMonth(task.month || selectedMonth);
        setFormDueDate(task.due_date || "");
        setFormDeliveryDate(task.delivery_date || "");
        setIsTaskModalOpen(true);
      };

      const handleSaveTask = async (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;
        const client = getSupabaseClient();

        const agreedPriceNum = Math.max(0, Number(formAgreedPrice) || 0);
        const depositNum =
          formPaymentStatus === "unpaid_deposit"
            ? 0
            : formPaymentStatus === "fully_paid"
            ? agreedPriceNum
            : Math.min(agreedPriceNum, Math.max(0, Number(formDepositAmount) || 0));

        if (editingTask) {
          const updates = {
            title: formTitle.trim(),
            customer_name: formCustomerName.trim(),
            description: formDesc.trim(),
            status: formStatus,
            priority: formPriority,
            work_size: formWorkSize,
            agreed_price: agreedPriceNum,
            payment_status: formPaymentStatus,
            deposit_amount: depositNum,
            month: formMonth,
            due_date: formDueDate || null,
            delivery_date: formDeliveryDate || null,
            updated_at: new Date().toISOString(),
          };
          if (client && storageMode === "supabase") {
            await client.from("tasks").update(updates).eq("id", editingTask.id);
          } else {
            const all = loadLocalTasks().map((t) => (t.id === editingTask.id ? { ...t, ...updates } : t));
            saveLocalTasks(all);
          }
        } else {
          const newTask = {
            id: crypto.randomUUID ? crypto.randomUUID() : `task-${Date.now()}`,
            title: formTitle.trim(),
            customer_name: formCustomerName.trim(),
            description: formDesc.trim(),
            status: formStatus,
            priority: formPriority,
            work_size: formWorkSize,
            agreed_price: agreedPriceNum,
            payment_status: formPaymentStatus,
            deposit_amount: depositNum,
            month: formMonth,
            due_date: formDueDate || null,
            delivery_date: formDeliveryDate || null,
            position: tasks.length,
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          };
          if (client && storageMode === "supabase") {
            const { id, ...payload } = newTask;
            await client.from("tasks").insert([payload]);
          } else {
            const all = [...loadLocalTasks(), newTask];
            saveLocalTasks(all);
          }
        }
        setIsTaskModalOpen(false);
        await loadBoard(selectedMonth);
      };

      const handleDeleteTask = async (id) => {
        const client = getSupabaseClient();
        if (client && storageMode === "supabase") {
          await client.from("tasks").delete().eq("id", id);
        } else {
          saveLocalTasks(loadLocalTasks().filter((t) => t.id !== id));
        }
        setIsTaskModalOpen(false);
        await loadBoard(selectedMonth);
      };

      const handleStatusChange = async (taskId, newStatus) => {
        const target = tasks.find((t) => t.id === taskId);
        if (!target || target.status === newStatus) return;

        const updatedMonth =
          newStatus === "delivered" && target.month < selectedMonth
            ? selectedMonth
            : target.month;

        setTasks((prev) =>
          prev.map((t) =>
            t.id === taskId ? { ...t, status: newStatus, month: updatedMonth } : t
          )
        );
        const client = getSupabaseClient();
        if (client && storageMode === "supabase") {
          await client.from("tasks").update({ status: newStatus, month: updatedMonth }).eq("id", taskId);
        } else {
          const all = loadLocalTasks().map((t) =>
            t.id === taskId ? { ...t, status: newStatus, month: updatedMonth } : t
          );
          saveLocalTasks(all);
        }
      };

      const handleMarkFullyPaid = async (task) => {
        const price = Number(task.agreed_price) || 0;
        setTasks((prev) =>
          prev.map((t) =>
            t.id === task.id ? { ...t, payment_status: "fully_paid", deposit_amount: price } : t
          )
        );
        const client = getSupabaseClient();
        if (client && storageMode === "supabase") {
          await client.from("tasks").update({ payment_status: "fully_paid", deposit_amount: price }).eq("id", task.id);
        } else {
          const all = loadLocalTasks().map((t) =>

          await loadBoard(selectedMonth);
          return;

        localStorage.setItem(

          JSON.stringify({ url: supabaseUrl.trim(), anonKey: supabaseKey.trim() })

        setSyncMessage("บันทึกค่าแล้ว กำลังเชื่อมต่อ Supabase...");
        await loadBoard(selectedMonth);
        setSyncMessage("ตั้งค่าเสร็จสมบูรณ์!");

          return;

        const local = loadLocalTasks();
        const payload = local.map((t, i) => ({
          title: t.title,
          customer_name: t.customer_name || "",
          description: t.description,
          status: t.status,
          priority: t.priority,
          work_size: t.work_size || "A4",
          agreed_price: Number(t.agreed_price) || 0,

          deposit_amount: Number(t.deposit_amount) || 0,
          month: t.month,
          due_date: t.due_date || null,
          delivery_date: t.delivery_date || null,
          position: i,

          setSyncMessage("อัปโหลดไม่สำเร็จ: " + error.message);

                                    <span className={`w-1.5 h-1.5 rounded-full ${pStyle.dot}`} />
                                    {pStyle.label}
                                  </span>
                                  {isCarriedOver && (
                                    <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-md bg-purple-100 text-purple-800 border border-purple-300">
                                      📌 ยกมาจาก {task.month}
                                    </span>
                                  )}
                                  {dueState === "overdue" && (
                                    <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-md bg-[#7b1e34] text-white animate-pulse">
                                      ⚠️ เลยกำหนด!
                                    </span>
                                  )}
                                </div>
                                <button
                                  onClick={() => openEditModal(task)}
                                  className="text-xs px-1.5 py-0.5 rounded hover:bg-pink-50 text-purple-600 hover:text-[#7b1e34] font-semibold"
                                >
                                  แก้ไข
                                </button>
                              </div>

                              <h3
                                onClick={() => openEditModal(task)}
                                className={`font-bold text-sm cursor-pointer hover:text-[#7b1e34] ${
                                  task.status === "delivered" ? "line-through text-slate-400" : "text-[#4a1220]"
                                }`}
                              >
                                {task.title}
                              </h3>

                              {task.customer_name && (
                                <div className="mt-1.5 inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-sky-100/90 border border-sky-200 text-xs text-sky-900 font-semibold max-w-full">
                                  <span className="truncate">👤 {task.customer_name}</span>
                                </div>
                              )}

                              {task.description && (
                                <p className="text-xs text-slate-600 mt-1.5 line-clamp-2">{task.description}</p>
                              )}

                              {/* Price & Deposit Box */}
                              <div className="mt-2.5 p-2 rounded-lg bg-gradient-to-br from-pink-50/90 via-purple-50/70 to-sky-50/90 border border-purple-200/80 space-y-1 text-[11px]">
                                <div className="flex items-center justify-between">
                                  <span className="text-purple-900/80 font-medium">ราคาที่ตกลง:</span>
                                  <span className="font-bold text-[#581322]">฿{formatTHB(agreedPrice)}</span>
                                </div>

                                <div className="flex items-center justify-between">
                                  <span className="text-purple-900/80 font-medium">สถานะมัดจำ:</span>
                                  {paymentStatus === "fully_paid" ? (
                                    <span className="px-1.5 py-0.2 rounded bg-sky-200/80 text-sky-950 border border-sky-300 font-semibold">
                                      ชำระครบแล้ว
                                    </span>
                                  ) : paymentStatus === "deposit_paid" ? (
                                    <span className="px-1.5 py-0.2 rounded bg-purple-200/80 text-purple-900 border border-purple-300 font-semibold">
                                      มัดจำแล้ว ฿{formatTHB(depositAmount)}
                                    </span>
                                  ) : (
                                    <span className="px-1.5 py-0.2 rounded bg-pink-200/80 text-[#7b1e34] border border-pink-300 font-semibold">
                                      ยังไม่เก็บมัดจำ
                                    </span>
                                  )}
                                </div>

                                {remainingBalance > 0 ? (
                                  <div className="pt-1 border-t border-purple-200/60 flex items-center justify-between gap-1">
                                    <span className="text-[#7b1e34] font-semibold">เก็บที่เหลือตอนส่ง:</span>
                                    <div className="flex items-center gap-1.5">
                                      <span className="font-bold text-[#7b1e34] text-xs">
                                        ฿{formatTHB(remainingBalance)}
                                      </span>
                                      <button
                                        type="button"
                                        onClick={() => handleMarkFullyPaid(task)}
                                        className="text-[10px] px-1.5 py-0.5 rounded bg-[#7b1e34] hover:bg-[#581322] text-white font-semibold shadow-sm transition"
                                        title="คลิกเมื่อเก็บเงินส่วนที่เหลือครบแล้ว"
                                      >
                                        ✓ รับครบ
                                      </button>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="pt-1 border-t border-purple-200/60 flex items-center justify-between text-sky-800 font-semibold">
                                    <span>ยอดคงเหลือตอนส่ง:</span>
                                    <span>฿0 (ครบแล้ว)</span>
                                  </div>
                                )}
                              </div>

                              <div className="mt-2 pt-2 border-t border-pink-100 space-y-1 text-[11px]">
                                {task.due_date && (
                                  <div className="flex items-center justify-between text-purple-800/80">
                                    <span>🛠️ กำหนดเสร็จ:</span>
                                    <span>{task.due_date}</span>
                                  </div>
                                )}
                                <div className={`flex items-center justify-between ${
                                  dueState === "overdue"
                                    ? "text-[#7b1e34] font-bold"
                                    : dueState === "due_today"
                                    ? "text-amber-700 font-semibold"
                                    : "text-[#581322] font-semibold"
                                }`}>
                                  <span>🚚 ถึงมือลูกค้า:</span>
                                  <span>{task.delivery_date || "ไม่ระบุวัน"}</span>
                                </div>
                              </div>

                              <div className="mt-2 pt-2 border-t border-pink-100">
                                <select
                                  value={task.status}
                                  onChange={(e) => handleStatusChange(task.id, e.target.value)}
                                  className="w-full bg-purple-50/90 border border-purple-200 text-[#4a1220] font-semibold rounded-lg px-2 py-1.5 text-xs"
                                >
                                  {COLUMNS.map((c) => (
                                    <option key={c.id} value={c.id}>สถานะ: {c.title}</option>
                                  ))}
                                </select>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {/* Task Modal */}
          {isTaskModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#3d0d18]/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white border-2 border-[#7b1e34]/20 rounded-t-3xl sm:rounded-2xl max-w-xl w-full p-5 sm:p-6 shadow-2xl max-h-[92vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-pink-200">
                  <h2 className="text-base font-bold text-[#581322]">
                    {editingTask ? "แก้ไขรายละเอียดงาน" : "เพิ่มคิวงานใหม่"}
                  </h2>
                  <button onClick={() => setIsTaskModalOpen(false)} className="text-purple-500 hover:text-[#7b1e34] p-1">✕</button>
                </div>

                <form onSubmit={handleSaveTask} className="space-y-4 mt-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-[#581322] mb-1">ชื่องาน *</label>
                      <input
                        type="text"
                        required
                        value={formTitle}
                        onChange={(e) => setFormTitle(e.target.value)}
                        placeholder="เช่น กรอบรูปป๊อปอัพแต่งงาน"
                        className="w-full bg-pink-50/40 border border-pink-200 rounded-xl px-3.5 py-2 text-sm text-[#4a1220] focus:outline-none focus:border-[#7b1e34] focus:bg-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-[#581322] mb-1">ชื่อลูกค้า *</label>
                      <input
                        type="text"
                        required
                        value={formCustomerName}
                        onChange={(e) => setFormCustomerName(e.target.value)}
                        placeholder="เช่น คุณพลอย (Line / IG)"
                        className="w-full bg-sky-50/50 border border-sky-200 rounded-xl px-3.5 py-2 text-sm text-[#4a1220] focus:outline-none focus:border-[#7b1e34] focus:bg-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2.5 sm:gap-3">
                    <div>
                      <label className="block text-xs font-bold text-[#581322] mb-1">ขนาดงาน</label>
                      <select
                        value={formWorkSize}
                        onChange={(e) => setFormWorkSize(e.target.value)}
                        className="w-full bg-purple-50/50 border border-purple-200 rounded-xl px-2.5 py-2 text-xs sm:text-sm font-semibold text-[#4a1220]"
                      >
                        {DEFAULT_WORK_SIZES.map((size) => {
                          const used = tasks.filter(
                            (t) => (t.work_size || "A4") === size && t.id !== editingTask?.id
                          ).length;
                          const max = quotas[size] ?? 10;
                          return (
                            <option key={size} value={size}>
                              {size} ({used}/{max})
                            </option>
                          );
                        })}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-[#581322] mb-1">สถานะงาน</label>
                      <select
                        value={formStatus}
                        onChange={(e) => setFormStatus(e.target.value)}
                        className="w-full bg-purple-50/50 border border-purple-200 rounded-xl px-2.5 py-2 text-xs sm:text-sm font-semibold text-[#4a1220]"
                      >
                        {COLUMNS.map((c) => (
                          <option key={c.id} value={c.id}>{c.title}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-[#581322] mb-1">ความสำคัญ</label>
                      <select
                        value={formPriority}
                        onChange={(e) => setFormPriority(e.target.value)}
                        className="w-full bg-purple-50/50 border border-purple-200 rounded-xl px-2.5 py-2 text-xs sm:text-sm font-semibold text-[#4a1220]"
                      >
                        <option value="high">High (ด่วน)</option>
                        <option value="medium">Medium (กลาง)</option>
                        <option value="low">Low (ทั่วไป)</option>
                      </select>
                    </div>
                  </div>

                  {/* Price & Deposit Box */}
                  <div className="p-3.5 rounded-2xl bg-gradient-to-br from-pink-50/90 via-purple-50/80 to-sky-50/90 border border-purple-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-[#581322]">🌷 ข้อมูลราคาและการมัดจำ</span>
                      <span className="text-xs text-purple-800 font-medium">คำนวณยอดคงเหลืออัตโนมัติ</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-[#581322] mb-1">ราคาที่ตกลง (บาท)</label>
                        <input
                          type="number"
                          min="0"
                          step="any"
                          value={formAgreedPrice}
                          onChange={(e) => setFormAgreedPrice(e.target.value)}
                          placeholder="เช่น 2500"
                          className="w-full bg-white border border-pink-200 rounded-xl px-3 py-2 text-sm text-[#4a1220]"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-[#581322] mb-1">สถานะมัดจำ</label>
                        <select
                          value={formPaymentStatus}
                          onChange={(e) => {
                            const nextStatus = e.target.value;
                            setFormPaymentStatus(nextStatus);
                            const price = Number(formAgreedPrice) || 0;
                            if (nextStatus === "unpaid_deposit") {
                              setFormDepositAmount("0");
                            } else if (nextStatus === "fully_paid") {
                              setFormDepositAmount(String(price));
                            } else if (nextStatus === "deposit_paid" && (!Number(formDepositAmount) || Number(formDepositAmount) === 0)) {
                              setFormDepositAmount(String(Math.round(price * 0.5)));
                            }
                          }}
                          className="w-full bg-white border border-pink-200 rounded-xl px-3 py-2 text-xs sm:text-sm font-medium text-[#4a1220]"
                        >
                          <option value="unpaid_deposit">ยังไม่เก็บมัดจำ</option>
                          <option value="deposit_paid">เก็บมัดจำแล้ว</option>
                          <option value="fully_paid">ชำระครบแล้ว (100%)</option>
                        </select>
                      </div>

                      <div>
                        <div className="flex items-center justify-between mb-1">
                          <label className="text-xs font-semibold text-[#581322]">ยอดมัดจำที่รับแล้ว</label>
                          {formPaymentStatus === "deposit_paid" && Number(formAgreedPrice) > 0 && (
                            <button
                              type="button"
                              onClick={() => setFormDepositAmount(String(Math.round(Number(formAgreedPrice) * 0.5)))}
                              className="text-[10px] text-[#7b1e34] font-bold hover:underline"
                            >
                              คิด 50%
                            </button>
                          )}
                        </div>
                        <input
                          type="number"
                          min="0"
                          step="any"
                          disabled={formPaymentStatus !== "deposit_paid"}
                          value={
                            formPaymentStatus === "unpaid_deposit"
                              ? "0"
                              : formPaymentStatus === "fully_paid"
                              ? formAgreedPrice
                              : formDepositAmount
                          }
                          onChange={(e) => setFormDepositAmount(e.target.value)}
                          placeholder="0"
                          className="w-full bg-white border border-pink-200 disabled:opacity-50 rounded-xl px-3 py-2 text-sm text-[#4a1220]"
                        />
                      </div>
                    </div>

                    <div className="flex items-center justify-between px-3 py-2 rounded-xl bg-white border border-purple-200 text-xs">
                      <span className="text-[#581322] font-semibold">ยอดที่ต้องเก็บเพิ่มเมื่อส่งมอบงาน:</span>
                      <span className={`text-sm font-bold ${modalRemainingPreview > 0 ? "text-[#7b1e34]" : "text-sky-700"}`}>
                        ฿{formatTHB(modalRemainingPreview)} บาท
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-[#581322] mb-1">ประจำเดือน</label>
                      <input
                        type="month"
                        value={formMonth}
                        onChange={(e) => setFormMonth(e.target.value)}
                        className="w-full bg-pink-50/40 border border-pink-200 rounded-xl px-3 py-2 text-sm text-[#4a1220]"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-[#581322] mb-1">วันกำหนดทำเสร็จ</label>
                      <input
                        type="date"
                        value={formDueDate}
                        onChange={(e) => setFormDueDate(e.target.value)}
                        className="w-full bg-pink-50/40 border border-pink-200 rounded-xl px-3 py-2 text-sm text-[#4a1220]"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-[#7b1e34] font-bold mb-1">วันที่ต้องส่งถึงมือลูกค้า</label>
                      <input
                        type="date"
                        value={formDeliveryDate}
                        onChange={(e) => setFormDeliveryDate(e.target.value)}
                        className="w-full bg-sky-50/70 border border-sky-300 rounded-xl px-3 py-2 text-sm text-[#4a1220]"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-[#581322] mb-1">รายละเอียดบรีฟ / ที่อยู่จัดส่ง</label>
                    <textarea
                      rows="2"
                      value={formDesc}
                      onChange={(e) => setFormDesc(e.target.value)}
                      placeholder="จดบันทึกบรีฟลูกค้า สีกรอบ ข้อความการ์ด หรือที่อยู่จัดส่ง..."
                      className="w-full bg-pink-50/40 border border-pink-200 rounded-xl px-3.5 py-2 text-sm text-[#4a1220]"
                    />
                  </div>

                  <div className="flex items-center justify-between pt-3 border-t border-pink-200">
                    {editingTask ? (
                      <button
                        type="button"
                        onClick={() => handleDeleteTask(editingTask.id)}
                        className="text-xs text-[#7b1e34] font-bold hover:underline"
                      >
                        ลบงานนี้
                      </button>
                    ) : <div />}
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsTaskModalOpen(false)}
                        className="px-4 py-2 rounded-xl text-xs font-semibold bg-purple-100 text-purple-900"
                      >
                        ยกเลิก
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2 rounded-xl text-xs font-bold bg-[#7b1e34] hover:bg-[#581322] text-white shadow-md shadow-[#7b1e34]/30"
                      >
                        บันทึกงาน
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Cloud Settings Modal */}
          {isCloudModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#3d0d18]/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border-2 border-[#7b1e34]/20 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-pink-200">
                  <h2 className="text-base font-bold text-[#581322]">☁️ ตั้งค่าฐานข้อมูล Supabase (Hybrid Mode)</h2>
                  <button onClick={() => setIsCloudModalOpen(false)} className="text-purple-400 hover:text-[#7b1e34]">✕</button>
                </div>
                <form onSubmit={handleSaveCloudSettings} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-[#581322] mb-1">Supabase Project URL</label>
                    <input
                      type="url"
                      value={supabaseUrl}
                      onChange={(e) => setSupabaseUrl(e.target.value)}
                      placeholder="https://xxxxxxxxxxxx.supabase.co"
                      className="w-full bg-pink-50/40 border border-pink-200 rounded-xl px-3.5 py-2 text-xs text-[#4a1220]"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-[#581322] mb-1">Supabase Anon Public Key</label>
                    <input
                      type="password"
                      value={supabaseKey}
                      onChange={(e) => setSupabaseKey(e.target.value)}
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      className="w-full bg-pink-50/40 border border-pink-200 rounded-xl px-3.5 py-2 text-xs text-[#4a1220]"
                    />
                  </div>
                  {syncMessage && (
                    <div className="p-3 rounded-xl bg-sky-50 border border-sky-200 text-xs text-sky-950 font-medium">
                      {syncMessage}
                    </div>
                  )}
                  <div className="flex flex-wrap items-center justify-between gap-2 pt-2">
                    <button
                      type="button"
                      onClick={handleSyncLocalToCloud}
                      className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-sky-100 text-sky-900 border border-sky-300"
                    >
                      ⬆️ ซิงค์งานจากเครื่องขึ้น Supabase
                    </button>
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsCloudModalOpen(false)}
                        className="px-3 py-2 rounded-xl text-xs font-semibold bg-purple-100 text-purple-900"
                      >
                        ปิด
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 rounded-xl text-xs font-bold bg-[#7b1e34] text-white"
                      >
                        บันทึกการเชื่อมต่อ
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
